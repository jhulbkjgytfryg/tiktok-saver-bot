name: Watch TikTok accounts

permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok-telegram-bot
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write TikTok cookies
        run: printf '%s' "$TIKTOK_COOKIES" > cookies.txt
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}

      - name: Run checker (fast, recent uploads)
        if: github.event.schedule != '17 * * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_and_send.py

      - name: Run checker (full account history)
        if: github.event.schedule == '17 * * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_and_send.py --full

      - name: Remove cookies file
        if: always()
        run: rm -f cookies.txt

      - name: Save updated seen.json
        run: |
          git config user.name "tiktok-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "Update seen videos"
          git push
